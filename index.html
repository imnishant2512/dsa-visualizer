<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DSA Visualizer</title>
    <meta
      name="description"
      content="Step forwards and backwards through sorting, searching, pathfinding, trees, graphs, hash tables and linear structures — every step exactly reversible."

    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- The brand mark from the nav. Without one, every first visit logged a
         404 for /favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <noscript>
      DSA Visualizer runs its algorithms in the browser and needs JavaScript enabled.
